name: Build New Krishna Sudha Enterprise APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Find and extract Android Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project folder:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Fix Gradle permissions
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Krishna-Sudha-Enterprise-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Find and extract Android Project ZIP
      - name: Find and extract Android Project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Android Project ZIP..."

          ZIP_FILE=$(find . -type f \
            \( -iname "*.zip" \) \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find android-project -maxdepth 5 -type f | sort | head -300

      # 4. Locate Gradle Project
      - name: Locate Gradle Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          echo "Android Gradle project:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "WARNING: app folder was not found directly inside project root."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Check Project
      - name: Check Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Important files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # 6. Install Gradle if gradlew is missing
      - name: Setup Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x ./gradlew
          else
            echo "Gradle Wrapper NOT found."
            echo "Installing Gradle 8.13..."

            cd "$GITHUB_WORKSPACE"

            wget -q \
              https://services.gradle.org/distributions/gradle-8.13-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip

            echo "$GITHUB_WORKSPACE/gradle-8.13/bin" >> "$GITHUB_PATH"

            echo "Gradle 8.13 installed."
          fi

      # 7. Show Gradle Version
      - name: Check Gradle Version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      # 8. Build Debug APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Starting Android APK build..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 9. Find APK
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find . -type f -name "*.apk" -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Krishna-Sudha-Enterprise-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract Android Project ZIP
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -200

          ZIP_FILE=$(find . -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android Project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 4 -type f | sort | head -300

      - name: Locate Gradle Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            echo "ZIP does not contain a valid Android Gradle project."
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -la
          find . -maxdepth 3 -type f | sort

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Krishna-Sudha-Enterprise-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
